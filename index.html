<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melate Retro Optimizer</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#f0f3f6',
              card: '#ffffff',
              green: '#00a650',
              greenHover: '#009245',
              greenLight: '#e6f7ef',
              slateHeader: '#444b52',
              border: '#e5e7eb',
              textMain: '#2b2f33',
              textMuted: '#6b7280'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-app-bg text-app-textMain min-h-screen flex flex-col items-center justify-start p-3 sm:p-6 antialiased font-sans">

  <div class="w-full max-w-xl flex flex-col gap-4">
    
    <!-- Header -->
    <header class="bg-white rounded-2xl border border-app-border p-4 shadow-sm flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-red-50 border border-red-100 flex items-center justify-center text-red-500 font-black text-xs shadow-inner">
          MR
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-800 tracking-tight flex items-center gap-2">
            Melate Retro
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-50 text-app-green border border-emerald-200">Optimizado</span>
          </h1>
          <p class="text-xs text-app-textMuted">Generador estocástico sin sesgo de calendario</p>
        </div>
      </div>
      <div class="w-7 h-7 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center font-bold text-xs cursor-help" title="Filtros: Paridad 3P-3I, Suma [100-140], Anti-fechas (≥2 números ≥32)">
        ?
      </div>
    </header>

    <!-- Parámetros / Reglas -->
    <section class="bg-white rounded-2xl border border-app-border p-4 shadow-sm space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Criterios Estadísticos</span>
        <span class="text-[11px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md font-medium">Activo</span>
      </div>

      <div class="grid grid-cols-2 gap-2.5 text-xs">
        <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl">
          <span class="text-slate-400 block text-[11px] font-medium">Paridad</span>
          <strong class="text-slate-700 font-semibold">3 Pares &amp; 3 Impares</strong>
        </div>
        <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl">
          <span class="text-slate-400 block text-[11px] font-medium">Suma Total</span>
          <strong class="text-slate-700 font-semibold">[100 – 140] (μ ≈ 120)</strong>
        </div>
        <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl">
          <span class="text-slate-400 block text-[11px] font-medium">Anti-Fechas</span>
          <strong class="text-slate-700 font-semibold">≥ 2 núms en [32 – 39]</strong>
        </div>
        <div class="bg-slate-50 border border-slate-100 p-2.5 rounded-xl">
          <span class="text-slate-400 block text-[11px] font-medium">Dispersión</span>
          <strong class="text-slate-700 font-semibold">Máx. 3 por docena</strong>
        </div>
      </div>

      <!-- Selector de cantidad y Botón de Acción -->
      <div class="pt-3 border-t border-slate-100 flex items-center justify-between gap-3">
        <div class="flex items-center gap-2 sm:gap-3">
          <span class="text-xs sm:text-sm font-semibold text-slate-700">Cantidad:</span>
          <div class="flex items-center gap-2">
            <button id="btnMinus" type="button" class="w-8 h-8 rounded-lg bg-emerald-100 text-app-green hover:bg-emerald-200 font-bold flex items-center justify-center transition active:scale-95 text-lg leading-none">
              -
            </button>
            <span id="betCountDisplay" class="font-bold text-slate-800 text-base min-w-[20px] text-center">3</span>
            <button id="btnPlus" type="button" class="w-8 h-8 rounded-lg bg-app-green text-white hover:bg-app-greenHover font-bold flex items-center justify-center transition active:scale-95 text-lg leading-none shadow-sm">
              +
            </button>
          </div>
        </div>

        <button id="generateBtn" class="bg-app-green hover:bg-app-greenHover text-white font-bold text-xs sm:text-sm px-5 py-2.5 rounded-xl shadow-sm transition-all active:scale-95 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span>GENERAR</span>
        </button>
      </div>
    </section>

    <!-- Contenedor de Boletos Generados -->
    <div class="space-y-3">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500 flex items-center gap-1.5">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
          </svg>
          Boletos Generados
        </h2>
        <span id="generatedCountBadge" class="text-[11px] font-semibold text-slate-500 bg-white border border-app-border px-2 py-0.5 rounded-full">3 jugadas</span>
      </div>

      <div id="results" class="flex flex-col gap-3"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
